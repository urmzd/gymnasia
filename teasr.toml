[output]
dir = "./showcase"

[[output.formats]]
output_type = "gif"
[[output.formats]]
output_type = "png"

[font]
family = "MonaspiceNe Nerd Font"

[[scenes]]
type = "terminal"
name = "cartpole-headless"
theme = "dracula"
cwd = "."
cols = 100
rows = 5

[[scenes.interactions]]
type = "type"
text = "export PS1='$ ' && clear"
speed = 1
[[scenes.interactions]]
type = "key"
key = "enter"
[[scenes.interactions]]
type = "wait"
duration = 500
[[scenes.interactions]]
type = "type"
text = "cargo run -q --example=cartpole_headless --no-default-features"
speed = 40
[[scenes.interactions]]
type = "key"
key = "enter"
[[scenes.interactions]]
type = "wait"
duration = 20000

[[scenes]]
type = "screen"
name = "cartpole"
setup = "cargo run --example=cartpole --features render &"
window = "CartPole"
delay = 5000
theme = "dracula"
title = "CartPole"
frame_duration = 100

